name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you considered
